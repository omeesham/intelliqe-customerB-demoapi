name: Playwright Tests

# CI/CD for the IntelliQE-generated Playwright suite.
# Runs on every push / pull request to the main branch, and on demand.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright tests (chromium)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is shipped, so fall back to npm install.
      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Provide these under Settings -> Secrets and variables -> Actions.
          BASE_URL: ${{ secrets.BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          # Azure SQL DB validation (optional) — set these secrets if tests query the DB.
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          HEADLESS: 'true'
          CI: 'true'

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: report/
          retention-days: 30

      - name: Upload traces and videos
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: traces
          path: traces/
          retention-days: 30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: logs
          path: logs/
          retention-days: 30
